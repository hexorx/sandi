name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ''
      JEV_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: env -u TYPESAFE_API_KEY pnpm lint
      - run: env -u TYPESAFE_API_KEY pnpm typecheck
      - run: env -u TYPESAFE_API_KEY pnpm test
      - run: env -u TYPESAFE_API_KEY pnpm build
      - name: Build jev-showcase Docker image
        run: docker build -f apps/jev-showcase/Dockerfile -t jev-showcase:ci .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/path" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-color /path
