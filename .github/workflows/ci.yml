name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ''
      JEV_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: env -u TYPESAFE_API_KEY pnpm lint
      - run: env -u TYPESAFE_API_KEY pnpm typecheck
      - run: env -u TYPESAFE_API_KEY pnpm test
      - run: env -u TYPESAFE_API_KEY pnpm build

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file apps/jev-showcase/Dockerfile --tag sandi-jev-showcase:ci .
      - name: Build Strands guardrails image
        run: docker build --file apps/strands-guardrails/Dockerfile --tag sandi-strands-guardrails:ci .
      - name: Check mock-mode endpoints
        shell: bash
        run: |
          set -euo pipefail
          container_name="sandi-jev-showcase-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }

          fail_with_logs() {
            echo "Container smoke test failed; container logs follow:" >&2
            docker logs "$container_name" 2>&1 || true
            exit 1
          }

          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:3000:3000 \
            --env JEV_MODE=mock \
            sandi-jev-showcase:ci || fail_with_logs

          for attempt in {1..30}; do
            health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/healthz 2>/dev/null || true)"
            mode_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/mode 2>/dev/null || true)"
            if [[ "$health_status" == "200" && "$mode_status" == "200" ]]; then
              echo "Container endpoints are ready (mock mode)."
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]]; then
              fail_with_logs
            fi
            sleep 1
          done

          echo "Timed out waiting for /healthz and /api/mode (last HTTP statuses: $health_status, $mode_status)." >&2
          fail_with_logs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/path" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-color /path

  e2e:
    runs-on: ubuntu-latest
    env:
      JEV_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: env -u TYPESAFE_API_KEY pnpm e2e
